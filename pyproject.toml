[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fenitop"]

[project]
name = "fenitop"
version = "0.1.0"
description = "FEniCSx-based topology optimization supporting parallel computing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=6.1.1",
    "pyvista>=0.44.2",
    "scipy>=1.15.1",
]